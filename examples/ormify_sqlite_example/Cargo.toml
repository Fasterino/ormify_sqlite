[package]
name = "ormify_sqlite_example"
version = "0.1.0"
edition = "2024"

[dependencies]
ormify = { version = "1.0.2", features = ["full", "bench"] }
ormify_sqlite = { path = "../../", features = [
    "tokio_file_engine",
    "tokio_bundled",
] }

# futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }
